name: CI - Host Tests & Firmware Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Host Tests & Arduino Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # 1. Host Tests (GoogleTest & GoogleMock)
      # ------------------------------------------------------------------------
      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: test/lib/googletest
          key: ${{ runner.os }}-googletest-v1.14.0

      - name: Run Host Unit Tests (GoogleTest / GMock)
        run: make test

      # ------------------------------------------------------------------------
      # 2. Firmware Build (arduino-cli)
      # ------------------------------------------------------------------------
      - name: Cache Arduino Core & Toolchain
        id: cache-arduino
        uses: actions/cache@v4
        with:
          path: ~/.arduino15/packages
          key: ${{ runner.os }}-arduino-avr-1.8.8

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/

      - name: Install AVR Core (if cache missed)
        if: steps.cache-arduino.outputs.cache-hit != 'true'
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Build Arduino Firmware
        run: make build
