name: CI - Host Tests, Coverage & Firmware Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Host Tests, Coverage & Arduino Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # 1. Host Tests & Code Coverage (GoogleTest, GoogleMock, lcov)
      # ------------------------------------------------------------------------
      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: test/lib/googletest
          key: ${{ runner.os }}-googletest-v1.14.0

      - name: Install Coverage Tools (lcov)
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Run Host Unit Tests & Generate Coverage
        run: |
          make coverage
          touch test/coverage/.nojekyll

      - name: Upload Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: test/coverage

      # ------------------------------------------------------------------------
      # 2. Firmware Build (arduino-cli)
      # ------------------------------------------------------------------------
      - name: Cache Arduino Core & Toolchain
        id: cache-arduino
        uses: actions/cache@v4
        with:
          path: ~/.arduino15/packages
          key: ${{ runner.os }}-arduino-avr-1.8.8

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/

      - name: Install AVR Core (if cache missed)
        if: steps.cache-arduino.outputs.cache-hit != 'true'
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Build Arduino Firmware
        run: make build

  deploy:
    name: Deploy Coverage to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
